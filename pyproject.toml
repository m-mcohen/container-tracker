[project]
name = "container-tracker"
version = "1.1.1"
description = "Track ocean shipping containers via ShipsGo API and sync to Excel."
# 3.12 is the actual build target (see build.bat). 3.13 is allowed once we
# choose to use it — pythonnet typically ships wheels for new Python minors
# within a few months. The hard upper bound stays at 3.14: that's the version
# that broke the iteration-1 install (no pythonnet wheel, NuGet build failure).
# Re-evaluate the upper bound when pythonnet 3.x ships wheels for 3.14+.
requires-python = ">=3.12,<3.14"
dependencies = [
    "requests",
    "openpyxl",
    "keyring",
    "packaging",
    "pillow",
    "pywebview>=5,<6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-mock",
]
# Only needed to run the legacy reference GUI (container_tracker_gui.py),
# which is not built or shipped.
legacy = [
    "customtkinter",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
