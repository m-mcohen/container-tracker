[project]
name = "container-tracker"
version = "1.0.0"
description = "Track ocean shipping containers via ShipsGo API and sync to Excel."
requires-python = ">=3.10"
dependencies = [
    "requests",
    "openpyxl",
    "keyring",
    "packaging",
    "customtkinter",
    "pillow",
    "pywebview>=5,<6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-mock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
